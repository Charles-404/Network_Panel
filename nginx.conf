# ============================================================
# FortiGate Network Panel - Nginx 生产环境配置
# ============================================================

# 工作进程数（建议设置为 CPU 核心数）
worker_processes auto;

# 错误日志
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # 单个进程最大连接数
    worker_connections 1024;
    # 使用 epoll 事件模型（Linux）
    use epoll;
    # 开启高效网络传输
    multi_accept on;
}

http {
    # ============================================================
    # 基础配置
    # ============================================================
    
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 字符编码
    charset utf-8;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    # 访问日志
    access_log /var/log/nginx/access.log main;

    # ============================================================
    # 性能优化
    # ============================================================

    # 零拷贝
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # 连接超时
    keepalive_timeout 65;
    keepalive_requests 1000;

    # 缓冲区
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_max_body_size 10m;

    # ============================================================
    # Gzip 压缩
    # ============================================================

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/bmp
        image/svg+xml
        text/cache-manifest
        text/calendar
        text/css
        text/javascript
        text/markdown
        text/plain
        text/xml
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # ============================================================
    # 安全头
    # ============================================================

    # 点击劫持保护
    add_header X-Frame-Options "SAMEORIGIN" always;

    # XSS 保护
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer 策略
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 权限策略
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss: http://*.local:3001 http://*.local:3002; font-src 'self' data:;" always;

    # 隐藏 Nginx 版本
    server_tokens off;

    # ============================================================
    # 上游服务器配置
    # ============================================================

    upstream backend_api {
        server 127.0.0.1:3001;
        keepalive 32;
    }

    upstream websocket_server {
        server 127.0.0.1:3002;
        keepalive 32;
    }

    # ============================================================
    # 主服务器配置
    # ============================================================

    server {
        listen 80;
        server_name _;  # 生产环境替换为实际域名

        # 重定向到 HTTPS（生产环境启用）
        # return 301 https://$server_name$request_uri;

        # 根目录（前端构建产物）
        root /usr/share/nginx/html;
        index index.html;

        # ============================================================
        # 静态资源缓存策略
        # ============================================================

        # 带哈希的静态资源 - 长期缓存
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # 图片资源
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }

        # 字体资源
        location ~* \.(woff|woff2|ttf|otf|eot)$ {
            expires 30d;
            add_header Cache-Control "public";
            add_header Access-Control-Allow-Origin "*";
            access_log off;
        }

        # ============================================================
        # API 代理
        # ============================================================

        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # 超时配置
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # 缓冲配置
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # ============================================================
        # WebSocket 代理
        # ============================================================

        location /ws {
            proxy_pass http://websocket_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 超时
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ============================================================
        # SPA 路由回退
        # ============================================================

        location / {
            try_files $uri $uri/ /index.html;

            # index.html 不缓存
            location = /index.html {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
            }
        }

        # ============================================================
        # 安全配置
        # ============================================================

        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # 禁止访问备份文件
        location ~* \.(bak|orig|save|swp|sql|conf)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # favicon.ico
        location = /favicon.ico {
            access_log off;
            log_not_found off;
            expires 30d;
        }

        # robots.txt
        location = /robots.txt {
            access_log off;
            log_not_found off;
        }

        # 健康检查端点
        location = /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
    }

    # ============================================================
    # HTTPS 服务器配置（生产环境启用）
    # ============================================================

    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     # ... 其余配置与 HTTP 相同 ...
    # }
}
