version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: network-panel-backend
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      DB_HOST: 192.168.2.100
      DB_PORT: 15432
      DB_NAME: network_panel
      DB_USER: postgres
      DB_PASSWORD: admin@123
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: network-panel-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped